<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report</title>
<style>
:root{--bg:#fff;--fg:#1d2433;--muted:#5d6678;--line:#dfe3ea;--accent:#2a5bd7;--warn:#a4540c;--good:#1f7a4d;--card:#f6f8fb}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e8ebf2;--muted:#9aa3b5;--line:#2a3040;--accent:#7c9cff;--warn:#f0a35c;--good:#5fcf97;--card:#1a1f2b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:780px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
h2{font-size:1.1rem;margin:28px 0 4px}
.meta{color:var(--muted);font-size:.9rem}
.note{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.banner{margin:16px 0;padding:10px 12px;border:1px solid var(--warn);border-radius:8px;color:var(--warn);font-size:.92rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:16px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-size:1.3rem}
.tile span{color:var(--muted);font-size:.82rem}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.item>b{display:block}
.item .sub{color:var(--muted);font-size:.9rem}
.tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:.78rem;color:var(--muted)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.tag.good{border-color:var(--good);color:var(--good)}
ol.steps{margin:8px 0 0 18px;padding:0}
details{margin-top:8px;color:var(--muted);font-size:.92rem}
details.more{margin:8px 0}
summary{cursor:pointer}
.ev{margin:6px 0 0 18px;padding:0}
.src{font-size:.82rem;color:var(--muted);margin-top:6px}
.kids{margin-top:6px}
.kids .item{background:var(--bg)}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* The skill replaces this object and nothing else.
   Item = { headline, meta, tags: [ "text" | { text, tone: "warn"|"good" } ], detail, steps: [], evidence: [], sources: [], children: [Item] } */
const DATA = {
  meta: { title: "", skill: "", generatedAt: "", view: "", firstRun: false, readCounts: "" },
  provisional: "",
  numbers: [],     // [ { label, value } ]
  sections: [],    // [ { id, title, note, cap, empty, items: [Item] } ]  cap 0 or missing = show all
  howBuilt: "",
  whyFree: "",
  readiness: "",   // empty unless a dimension is weak
  readinessUrl: "",
  config: ""
};
const app = document.getElementById("app");
function el(tag, text, cls){ const n = document.createElement(tag); if(text) n.textContent = text; if(cls) n.className = cls; return n; }
function list(tag, cls, rows){ const n = el(tag, "", cls); rows.forEach(r => n.appendChild(el("li", r))); return n; }
function tag(t){ const o = typeof t === "string" ? { text: t } : t; return el("span", o.text, "tag" + (o.tone ? " " + o.tone : "")); }
function itemNode(it){
  const box = el("div", "", "item");
  box.appendChild(el("b", it.headline));
  if(it.meta) box.appendChild(el("div", it.meta, "sub"));
  if(it.tags && it.tags.length){ const t = el("div", "", "tags"); it.tags.forEach(x => t.appendChild(tag(x))); box.appendChild(t); }
  if(it.detail) box.appendChild(el("div", it.detail));
  if(it.steps && it.steps.length) box.appendChild(list("ol", "steps", it.steps));
  if(it.evidence && it.evidence.length){ const d = el("details"); d.appendChild(el("summary", "Evidence")); d.appendChild(list("ul", "ev", it.evidence)); box.appendChild(d); }
  if(it.children && it.children.length){ const d = el("details"); d.appendChild(el("summary", "Open (" + it.children.length + ")")); const k = el("div", "", "kids"); it.children.forEach(c => k.appendChild(itemNode(c))); d.appendChild(k); box.appendChild(d); }
  if(it.sources && it.sources.length) box.appendChild(el("div", "Sources: " + it.sources.join("; "), "src"));
  return box;
}
document.title = DATA.meta.title || "Report";
app.appendChild(el("h1", DATA.meta.title));
app.appendChild(el("div", [DATA.meta.view, DATA.meta.generatedAt, DATA.meta.readCounts].filter(Boolean).join(" · "), "meta"));
if(DATA.meta.firstRun) app.appendChild(el("div", "How to read this: each section lists findings first, then the steps to act on them. Open Evidence for the detail behind a finding.", "meta"));
if(DATA.provisional) app.appendChild(el("div", DATA.provisional, "banner"));
if(DATA.numbers.length){ const g = el("div", "", "tiles"); DATA.numbers.forEach(n => { const t = el("div", "", "tile"); t.appendChild(el("b", String(n.value))); t.appendChild(el("span", n.label)); g.appendChild(t); }); app.appendChild(g); }
DATA.sections.forEach(sec => {
  app.appendChild(el("h2", sec.title));
  if(sec.note) app.appendChild(el("p", sec.note, "note"));
  const items = sec.items || [];
  if(!items.length){ app.appendChild(el("p", sec.empty || "Nothing here.", "note")); return; }
  const cap = sec.cap > 0 ? sec.cap : items.length;
  items.slice(0, cap).forEach(it => app.appendChild(itemNode(it)));
  if(items.length > cap){ const d = el("details", "", "more"); d.appendChild(el("summary", "+" + (items.length - cap) + " more")); items.slice(cap).forEach(it => d.appendChild(itemNode(it))); app.appendChild(d); }
});
const f = el("footer");
const d = el("details"); d.appendChild(el("summary", "How this was built")); d.appendChild(el("div", DATA.howBuilt)); f.appendChild(d);
if(DATA.whyFree) f.appendChild(el("p", DATA.whyFree));
if(DATA.readiness){ const p = el("p", DATA.readiness + " "); if(DATA.readinessUrl){ const a = el("a", "Full check"); a.href = DATA.readinessUrl; a.rel = "noopener"; p.appendChild(a); } f.appendChild(p); }
f.appendChild(el("div", "Config: " + DATA.config));
app.appendChild(f);
</script>
</body>
</html>
